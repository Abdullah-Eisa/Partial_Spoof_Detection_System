
# Training configuration
training:
  num_epochs: &num_epochs 15
  # num_epochs: &num_epochs 2
  learning_rate: &learning_rate 0.00075
  # batch_size: &batch_size 8
  batch_size: &batch_size 4
  save_interval: 5
  patience: 30
  max_grad_norm: 1.0
  gamma: 0.9
  monitor_dev_epoch: 0
  use_wandb: true
  # use_wandb: false
  
  # Learning rate scheduler configuration
  use_lr_scheduler: true  # Set to false to use fixed learning rate
  # use_lr_scheduler: false  # Set to false to use fixed learning rate
  lr_scheduler:
    # Scheduler type: 'reduce_on_plateau', 'cosine', 'step', 'exponential'
    type: 'reduce_on_plateau'
    
    # ReduceLROnPlateau parameters
    factor: 0.8  # Multiplicative factor for LR reduction
    patience: 5  # Epochs with no improvement before LR reduction
    threshold: 0.009  # Minimum change to qualify as improvement
    min_lr: 0.00001  # Minimum learning rate

# WandB sweep configuration
wandb_sweep:
  NUM_EPOCHS:
    values: [*num_epochs]
  LEARNING_RATE:
    values: [*learning_rate]
  BATCH_SIZE:
    values: [*batch_size]



# Feature Extractor configuration
feature_extractor:
  type: "wav2vec2"  # Options: "wav2vec2", "hubert", "mfcc", "lfcc"
  # type: "hubert"
  # type: "mfcc"
  # type: "lfcc"

  # SSL models (wav2vec2, hubert)
  ssl_checkpoint: "${BASE_DIR}/models/w2v_large_lv_fsh_swbd_cv.pt"
  # ssl_checkpoint: "${BASE_DIR}/models/hubert-large-ls960-ft"
  
  # Path to finetuned feature extractor checkpoint (optional)
  # If save_feature_extractor=true during training, use the saved finetuned checkpoint here
  # Set to null to use the original pretrained model
  finetuned_checkpoint: null
  # finetuned_checkpoint: "${BASE_DIR}/models/w2v_large_lv_fsh_swbd_cv_20260106_130514.pt"
  # finetuned_checkpoint: "${BASE_DIR}/models/w2v_large_lv_fsh_swbd_cv_20260107_052842.pt"
  # Example: "${BASE_DIR}/models/back_end_models/w2v_large_lv_fsh_swbd_cv_20260106_130514.pt"
  
  # MFCC parameters
  mfcc_n_mfcc: 40
  mfcc_log_mels: true
  mfcc_sample_rate: 16000
  mfcc_n_fft: 400
  mfcc_hop_length: 160
  # mfcc_n_mels: 80
  mfcc_n_mels: 40


  # LFCC parameters
  # lfcc_n_filters: 20
  # lfcc_n_lfcc: 40
  lfcc_n_filters: 80
  lfcc_n_lfcc: 56
  lfcc_sample_rate: 16000
  lfcc_n_fft: 512
  lfcc_hop_length: 160


# Model configuration  
model:
  # feature_dim: 768  # 768 for wav2vec2/hubert, 40 for mfcc/lfcc
  feature_dim: 768  # 768 for wav2vec2/hubert, 40 for mfcc/lfcc
  num_heads: 8
  hidden_dim: 128
  max_dropout: 0.35
  # max_dropout: 0.15671
  depthwise_conv_kernel_size: 31
  conformer_layers: 1
  max_pooling_factor: 3
  use_max_pooling: true  # Set to false for small feature dims like MFCC/LFCC
  # use_max_pooling: false  # Set to false for small feature dims like MFCC/LFCC
  

  # Dropout configuration
  # Options: 'fixed' (constant dropout), 'cosine' (cosine annealing), 'linear' (linear annealing), 'step' (step decay)
  # dropout_mode: 'fixed'  # Use 'fixed' for constant dropout, 'cosine'/'linear'/'step' for epoch-based scheduling
  dropout_mode: 'cosine'  # Cosine annealing
  # dropout_mode: 'linear'  # Linear annealing
  # dropout_mode: 'step'  # Step decay
  
  # Fixed dropout probability (used when dropout_mode is 'fixed')
  fixed_dropout: 0.35
  
  # Dropout scheduler configuration (used when dropout_mode is 'cosine', 'linear', or 'step')
  dropout_scheduler:
    # Cosine annealing parameters
    cosine:
      initial_dropout: 0.35  # Starting dropout rate
      final_dropout: 0.0  # Minimum dropout rate
    
    # Linear annealing parameters
    linear:
      initial_dropout: 0.35  # Starting dropout rate
      final_dropout: 0.0  # Ending dropout rate
    
    # Step decay parameters
    step:
      initial_dropout: 0.35  # Starting dropout rate
      step_size: 5  # Number of epochs for each step
      gamma: 0.8  # Multiplicative decay factor per step (new_dropout = current_dropout * gamma)


  # ====== NEW: Sequence Model Configuration ======
  # Options: 'conformer', 'lstm', 'transformer', 'cnn', 'tcn'
  sequence_model_type: 'conformer'
  # sequence_model_type: 'cnn'
  
  # Additional sequence model configuration (optional)
  # These settings override defaults for the selected sequence model
  sequence_model_config:
    # Common parameters (used by most models)
    hidden_dim: 128
    num_layers: 2
    dropout: 0.2
    
    # CNN/TCN specific
    kernel_size: 3
    
    # Transformer specific
    num_heads: 8



  # ====== NEW: Time Dimension Pooling Strategy ======
  # Options: "self_weighted", "average"
  # "self_weighted": Uses attention-based pooling (SelfWeightedPooling)
  # "average": Uses simple global average pooling across time dimension
  time_pooling_strategy: "self_weighted"
  # time_pooling_strategy: "average"
  # ====== END NEW ======

  # Pooling strategy configuration (for feature dimension reduction)
  # Options: "self_weighted", "max", "average", "attention", "strided_conv"
  # pooling_strategy: "self_weighted"  # Default pooling strategy
  pooling_strategy: "max"  
  
  # Max pooling parameters
  max_pooling:
    kernel_size: 3
    stride: 3
    # kernel_size: 6
    # stride: 6
  
  # Average pooling parameters
  average_pooling:
    kernel_size: 3
    stride: 3
  
  # Attention pooling (LearnedFeatureProjection) parameters
  attention_pooling:
    output_dim: 256  # Output dimension after attention projection
  
  # Strided convolution pooling parameters
  strided_conv_pooling:
    out_channels: 256
    kernel_size: 3
    stride: 3
    padding: 0

