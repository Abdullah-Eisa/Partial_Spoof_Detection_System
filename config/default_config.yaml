# Multi-dataset training configuration
multi_dataset:
  enabled: true  # Set to true to enable multi-dataset training
  
  # Training datasets
  train_datasets:
    - dataset_name: "RFP_Dataset"
      data_path: "${BASE_DIR}/database/RFP/training"
      labels_path: "${BASE_DIR}/database/RFP/labels/ASVspoof2017_V2_train.trl.txt"
    
    - dataset_name: "PartialSpoof_Dataset"
      # data_path: "${BASE_DIR}/database/PartialSpoof/database/train/con_wav"
      data_path: "${BASE_DIR}/database/PartialSpoof/train/con_wav"
      labels_path: "${BASE_DIR}/database/utterance_labels/PartialSpoof_LA_cm_train_trl.json"
    
    - dataset_name: "ASVspoof2019_LA_Dataset"
      data_path: "${BASE_DIR}/database/ASVspoof2019/LA/ASVspoof2019_LA_train/flac"
      labels_path: "${BASE_DIR}/database/ASVspoof2019/LA/ASVspoof2019_LA_cm_protocols/ASVspoof2019.LA.cm.train.trn.txt"
  
  # Dev/validation datasets
  dev_datasets:
    - dataset_name: "RFP_Dataset"
      data_path: "${BASE_DIR}/database/RFP/validation"
      labels_path: "${BASE_DIR}/database/RFP/labels/ASVspoof2017_V2_dev.trl.txt"
    
    - dataset_name: "PartialSpoof_Dataset"
      # data_path: "${BASE_DIR}/database/PartialSpoof/database/dev/con_wav"
      data_path: "${BASE_DIR}/database/PartialSpoof/dev/con_wav"
      labels_path: "${BASE_DIR}/database/utterance_labels/PartialSpoof_LA_cm_dev_trl.json"
    
    - dataset_name: "ASVspoof2019_LA_Dataset"
      data_path: "${BASE_DIR}/database/ASVspoof2019/LA/ASVspoof2019_LA_dev/flac"
      labels_path: "${BASE_DIR}/database/ASVspoof2019/LA/ASVspoof2019_LA_cm_protocols/ASVspoof2019.LA.cm.dev.trl.txt"



# Model paths
paths:
  ssl_checkpoint: "${BASE_DIR}/models/w2v_large_lv_fsh_swbd_cv.pt"
  model_save_dir: "${BASE_DIR}/models/back_end_models"
  wandb_key_file: "${BASE_DIR}/config/wandb_key.txt"
  # Add the PS model checkpoint path
  # ps_model_checkpoint: "${BASE_DIR}/models/back_end_models/ASVspoof2019LA_model_epochs25_batch8_lr0.0001_20250116_192748.pth"
  ps_model_checkpoint: "${BASE_DIR}/models/back_end_models/RFP_Dataset_model_epochs30_batch8_lr0.0006_20251201_001017.pth"


# Inference configuration
inference:
  use_cuda: true
  batch_size: 16
  num_workers: 8
  prefetch_factor: 2
  pin_memory: true
  apply_transform: false

# System configuration
system:
  num_workers: 16
  prefetch_factor: 2
  pin_memory: true
  device: "cuda"  # Will be overridden based on availability
  apply_transform: false
  save_feature_extractor: false

